name: Fetch Daily Mortgage Rates

on:
  schedule:
    - cron: '0 15 * * *'   # 10 AM ET year-round (15:00 UTC covers both EDT and EST)
  workflow_dispatch:        # allows manual trigger from GitHub Actions UI

jobs:
  fetch-rates:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Fetch rates and store in Supabase
        run: |
          curl -fsSL "https://raw.githubusercontent.com/product-launchpad/mortgage-rates/main/scripts/fetch-rates.js" -o /tmp/fetch-rates.js
          node /tmp/fetch-rates.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
