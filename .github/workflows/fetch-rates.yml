name: Fetch Daily Mortgage Rates

on:
  schedule:
    # 10:00 AM ET = 14:00 UTC (EDT, Apr–Oct) / 15:00 UTC (EST, Nov–Mar)
    # Running at both times covers the clock change — isStale() in the app
    # ensures only the first successful fetch per day is served to users.
    - cron: '0 14 * * *'   # 10 AM EDT (summer)
    - cron: '0 15 * * *'   # 10 AM EST (winter)
  workflow_dispatch:        # allows manual trigger from GitHub Actions UI

jobs:
  fetch-rates:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch rates and store in Supabase
        run: node scripts/fetch-rates.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
